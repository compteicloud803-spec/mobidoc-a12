name: Build macOS App (Nuitka)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install nuitka
        pip install pyside6 pymobiledevice3 colorama certifi
        # Si tu as un requirements.txt, tu peux aussi l'utiliser :
        # pip install -r requirements.txt

    - name: Build app with Nuitka
      run: |
        python3 -m nuitka \
          --macos-create-app-bundle \
          --enable-plugin=pyside6 \
          --macos-app-name="MobiDoc A12+" \
          --macos-app-icon=img/logo.icns \
          --include-data-dir=img=img \
          --include-data-dir=fonts=fonts \
          --standalone \
          Rust-main.py

    - name: Find and display .app bundle
      run: |
        echo "Contents of current directory:"
        ls -la
        echo "Searching for .app bundles:"
        find . -name "*.app" -type d

    - name: Upload .app artifact
      uses: actions/upload-artifact@v4
      with:
        name: MobiDoc-A12+
        path: "**/*.app"          # Capture n'importe quel .app trouvé
        if-no-files-found: error   # Échoue si aucun .app n'est trouvé
